name: Build and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild plugin and MCP bundles
        run: npm run build

      - name: Check committed bundles
        shell: pwsh
        run: |
          $changes = git status --porcelain --untracked-files=all -- dist/
          if ($changes) {
            $changes
            throw 'Run npm run build and commit the updated dist/ files.'
          }

      - name: Run tests with the mock FilmCraft engine
        run: npm test

  mcp-stdio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Node writes asynchronously to pipes on Linux.
      - name: Check piped MCP replies
        run: node --test test/mcp-stdio.test.mjs
